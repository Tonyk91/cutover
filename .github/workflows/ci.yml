name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Replays 20 000 price changes and asserts the gate decisions (see scripts/simulate.ts).
      - run: npm run simulate -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: replay-report
          path: reports/replay.md
